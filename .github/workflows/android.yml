name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # versionName comes from version.properties (read below); the GitHub run
      # number becomes versionCode so every build from git is uniquely numbered.
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          NAME=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "APP_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Building TwoTracks $NAME (build ${{ github.run_number }})"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Provision google-services.json
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${GS_B64:-}" ]; then
            echo "$GS_B64" | base64 -d > app/google-services.json
            echo "using google-services.json from secret."
          else
            cp ci/google-services-placeholder.json app/google-services.json
            echo "using committed placeholder (app will not reach a real backend)."
          fi

      - name: Unit tests (planner, seed)
        run: gradle :core:planner:test :core:seed:test --no-daemon

      - name: Build debug APK (signed with the committed debug keystore)
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/TwoTracks_${APP_VERSION_NAME}.apk"
          ls -la dist

      # APKs are delivered through GitHub Releases (below), not Actions artifacts:
      # the account's Actions artifact storage quota is already used up.
      - name: Extract changelog section
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          awk -v ver="${APP_VERSION_NAME}" '
            $0 ~ "^## \\[" ver "\\]" { show=1; next }
            show && /^## \[/ { exit }
            show { print }
          ' CHANGELOG.md > dist/notes.md
          if [ ! -s dist/notes.md ]; then echo "No changelog entry for ${APP_VERSION_NAME} yet." > dist/notes.md; fi
          printf '\nBuild %s from commit %s.\n' "${{ github.run_number }}" "${{ github.sha }}" >> dist/notes.md

      # Only the newest APK is kept on GitHub: every earlier release (and its
      # APK) is deleted before this build's release is created. Git tags of
      # versioned releases stay so history is still visible.
      - name: Delete previous releases and their APKs
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName -q '.[].tagName' | while read -r tag; do
            [ -z "$tag" ] && continue
            if [ "$tag" = "latest" ]; then
              gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag || true
            else
              gh release delete "$tag" --repo "${{ github.repository }}" --yes || true
            fi
            echo "deleted release $tag"
          done

      - name: Publish rolling "latest" pre-release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TwoTracks ${{ env.APP_VERSION_NAME }} (build ${{ github.run_number }}, latest)
          prerelease: true
          body_path: dist/notes.md
          files: dist/TwoTracks_${{ env.APP_VERSION_NAME }}.apk

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TwoTracks ${{ env.APP_VERSION_NAME }}
          body_path: dist/notes.md
          files: dist/TwoTracks_${{ env.APP_VERSION_NAME }}.apk
